  /subdivisions/{id}:
    get:
      tags:
        - Subdivisions
      summary: Get subdivision by ID
      description: |
        Returns a single subdivision by its ID.

        Returns 404 if the subdivision doesn't exist or belongs to a different notary.
      operationId: getSubdivision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subdivision ID
          schema:
            type: integer
      responses:
        '200':
          description: Subdivision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdivisionResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subdivision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Subdivision not found"

    put:
      tags:
        - Subdivisions
      summary: Update a subdivision
      description: |
        Updates an existing subdivision.

        - Can be used to modify name or status
        - Setting status to 2 effectively deactivates the subdivision (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateSubdivision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subdivision ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubdivisionRequest'
      responses:
        '204':
          description: Subdivision updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subdivision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Subdivision not found"

  /deed-types:
    get:
      tags:
        - DeedTypes
      summary: List all deed types
      description: |
        Returns all deed types for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listDeedTypes
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of deed types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeedTypeResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - DeedTypes
      summary: Create a new deed type
      description: |
        Creates a new deed type for the authenticated user's notary.

        - Deed type name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createDeedType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeedTypeRequest'
      responses:
        '201':
          description: Deed type created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Deed type name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Deed type name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deed-types/{id}:
    get:
      tags:
        - DeedTypes
      summary: Get deed type by ID
      description: |
        Returns a single deed type by its ID.

        Returns 404 if the deed type doesn't exist or belongs to a different notary.
      operationId: getDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      responses:
        '200':
          description: Deed type details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeedTypeResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deed type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Deed type not found"

    put:
      tags:
        - DeedTypes
      summary: Update a deed type
      description: |
        Updates an existing deed type.

        - Can be used to modify name, description, maxInscriptions, enableSubdivisions, or status
        - Setting status to 2 effectively deactivates the deed type (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeedTypeRequest'
      responses:
        '204':
          description: Deed type updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deed type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Deed type not found"

  /payment-taxes:
    get:
      tags:
        - PaymentTaxes
      summary: List payment taxes
      description: |
        Returns all payment taxes of the authenticated user's notary, ordered by name.

        Supports optional filtering by status and name. The name filter is a partial match,
        case- and accent-insensitive (e.g. `subdivision` matches "Pago de Subdivisión").
        The wildcards `%` and `_` are treated as literal characters.
      operationId: listPaymentTaxes
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case- and accent-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of payment taxes (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTaxResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - PaymentTaxes
      summary: Create a payment tax
      description: |
        Creates a payment tax for the authenticated user's notary.

        - The name must be unique within the notary (case- and accent-insensitive)
        - Names are trimmed before validation and storage
        - Emoji and other 4-byte characters are not supported
      operationId: createPaymentTax
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentTaxRequest'
      responses:
        '201':
          description: Payment tax created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      taxName: "Tax name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Tax name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-taxes/{id}:
    get:
      tags:
        - PaymentTaxes
      summary: Get payment tax by ID
      description: |
        Returns a single payment tax by its ID.

        Returns 404 if the tax doesn't exist, belongs to a different notary, or the ID is not positive.
      operationId: getPaymentTax
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment tax ID
          schema:
            type: integer
      responses:
        '200':
          description: Payment tax details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTaxResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Tax not found"

    put:
      tags:
        - PaymentTaxes
      summary: Update a payment tax
      description: |
        Partially updates a payment tax. Fields that are omitted are left unchanged,
        but at least one of `taxName` or `status` is required.

        - Setting status to 2 deactivates the tax (soft delete); there is no DELETE endpoint
        - Name uniqueness is validated only when `taxName` is sent, excluding the current record
        - Deactivating a tax that is used by a payment procedure is allowed
      operationId: updatePaymentTax
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment tax ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentTaxRequest'
      responses:
        '204':
          description: Payment tax updated successfully (no body)
        '400':
          description: Invalid ID format, validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Empty body
                  value:
                    error: "Validation failed"
                    errors:
                      body: "At least one field (taxName, status) is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Tax name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Tax not found"

  /payment-procedures:
    get:
      tags:
        - PaymentProcedures
      summary: List payment procedures
      description: |
        Returns all payment procedures of the authenticated user's notary, ordered by name.
        The list is not paginated.

        Supports optional filtering by status and name. The name filter is a partial match,
        case- and accent-insensitive (e.g. `subdivision` matches "SUBDIVISIÓN").
        The wildcards `%` and `_` are treated as literal characters.
      operationId: listPaymentProcedures
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case- and accent-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of payment procedures (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentProcedureResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - PaymentProcedures
      summary: Create a payment procedure
      description: |
        Creates a payment procedure for the authenticated user's notary.

        - The name must be unique within the notary (case- and accent-insensitive)
        - Names are trimmed before validation and storage
        - Emoji and other 4-byte characters are not supported
        - `notaryId` in the body is ignored; the notary of the token is always used
      operationId: createPaymentProcedure
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentProcedureRequest'
      responses:
        '201':
          description: Payment procedure created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      procedureName: "Procedure name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Procedure name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-procedures/{id}:
    get:
      tags:
        - PaymentProcedures
      summary: Get payment procedure by ID
      description: |
        Returns a single payment procedure by its ID.

        Returns 404 if the procedure doesn't exist, belongs to a different notary, or the ID is not positive.
      operationId: getPaymentProcedure
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment procedure ID
          schema:
            type: integer
      responses:
        '200':
          description: Payment procedure details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProcedureResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Procedure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Procedure not found"

    put:
      tags:
        - PaymentProcedures
      summary: Update a payment procedure
      description: |
        Partially updates a payment procedure. Fields that are omitted are left unchanged,
        but at least one of `procedureName` or `status` is required.

        - Setting status to 2 deactivates the procedure (soft delete); there is no DELETE endpoint (405)
        - Name uniqueness is validated only when the name actually changes (case-insensitive),
          excluding the current record. Re-sending the current name is accepted.
      operationId: updatePaymentProcedure
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment procedure ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentProcedureRequest'
      responses:
        '204':
          description: Payment procedure updated successfully (no body)
        '400':
          description: Invalid ID format, validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Empty body
                  value:
                    error: "Validation failed"
                    errors:
                      body: "At least one field (procedureName, status) is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Procedure name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Procedure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Procedure not found"

  /payment-clients:
    get:
      tags:
        - PaymentClients
      summary: List payment clients
      description: |
        Returns all payment clients of the authenticated user's notary, in natural alphabetical
        order by full name (case- and accent-insensitive; ties are ordered by `clientId`).
        The list is not paginated.

        Supports optional filtering by status and name. The name filter is a partial match,
        case- and accent-insensitive (e.g. `lopez` matches "José López").
        The wildcards `%` and `_` are treated as literal characters. An empty `name` means no filter.
      operationId: listPaymentClients
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by full name (partial match, case- and accent-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of payment clients (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentClientResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - PaymentClients
      summary: Create a payment client
      description: |
        Creates a payment client for the authenticated user's notary.

        - Full name is required; `phone` and `email` are optional and default to an empty string
        - Names are **not** unique: two clients may share the same name
        - All strings are trimmed before validation and storage
        - `phone` and `email` accept `null` or `""`, both stored as an empty string
        - Emoji and other 4-byte characters are not supported
        - `notaryId` in the body is ignored; the notary of the token is always used
        - The response has no body, so the new `clientId` can't be read from it
      operationId: createPaymentClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentClientRequest'
      responses:
        '201':
          description: Payment client created successfully (no body)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  fullName: "Full name is required"
                  email: "Email format is invalid"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-clients/{id}:
    get:
      tags:
        - PaymentClients
      summary: Get payment client by ID
      description: |
        Returns a single payment client by its ID.

        Returns 404 if the client doesn't exist, belongs to a different notary, or the ID is not positive.
      operationId: getPaymentClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment client ID
          schema:
            type: integer
      responses:
        '200':
          description: Payment client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentClientResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Client not found"

    put:
      tags:
        - PaymentClients
      summary: Update a payment client
      description: |
        Partially updates a payment client. At least one of `fullName`, `phone`, `email` or `status`
        is required.

        Field semantics:
        - **Omitted** field: the current value is kept
        - `phone` / `email` sent as `""`, whitespace only, or `null`: the value is **cleared** (stored as an empty string)
        - `fullName` sent as `null` or blank: rejected with 400 (the name can't be cleared)
        - Setting status to 2 deactivates the client (soft delete); there is no DELETE endpoint (405)
        - Names are not unique, so no duplicate check is performed

        The body is validated before the client is looked up: an invalid body for a non-existent ID returns 400.
      operationId: updatePaymentClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment client ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentClientRequest'
      responses:
        '204':
          description: Payment client updated successfully (no body)
        '400':
          description: Invalid ID format or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  body: "At least one field (fullName, phone, email, status) is required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Client not found"

  /deeds:
    get:
      tags:
        - Deeds
      summary: List deeds
      description: |
        Returns a paginated list of the deeds of the authenticated user's notary
        (100 per page), ordered by deed number descending. Numeric deed numbers come
        first; non-numeric ones are placed last.

        **Search:** `search` is split into words (max 10 words, 100 characters each).
        Matching is case- and accent-insensitive and every word must match as a substring.
        A deed matches when all words are found in its number + act name, or when all words
        are found in the number + act name + name of a single active participant
        (seller or buyer). Word order is irrelevant.

        A page beyond the last one returns `200` with an empty `data` array.
      operationId: listDeeds
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (positive integer). Defaults to 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: search
          in: query
          description: Free text searched in deed number, act name and participant names
          required: false
          schema:
            type: string
          example: "compraventa perez"
      responses:
        '200':
          description: Paginated list of deeds
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeedListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  page: "Page must be a positive integer"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notary:
    get:
      tags:
        - Notary
      summary: Get current notary profile
      description: |
        Returns the profile information of the authenticated user's notary.

        - The notary ID is obtained from the JWT token
        - Returns 404 if the notary is inactive
      operationId: getNotary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notary profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

    post:
      tags:
        - Notary
      summary: Update current notary profile
      description: |
        Updates the profile information of the authenticated user's notary.

        - Uses POST instead of PUT to support multipart/form-data for logo upload
        - The notary ID is obtained from the JWT token
        - Only provided fields are updated (except name and notaryName which are required)
        - Logo must be JPG or PNG, max 512 KB
        - Logo is validated for real image content (not just extension)
      operationId: updateNotary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateNotaryRequest'
      responses:
        '204':
          description: Notary updated successfully (no body)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Field validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Notary name is required"
                logo_size:
                  summary: Logo too large
                  value:
                    error: "Logo file exceeds maximum size of 512 KB"
                logo_format:
                  summary: Invalid logo format
                  value:
                    error: "Logo must be JPG or PNG format"
                logo_invalid:
                  summary: Invalid image file
                  value:
                    error: "Invalid image file"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

  /notary/logo:
    get:
      tags:
        - Notary
      summary: Get notary logo
      description: |
        Returns the logo image of the authenticated user's notary.

        - Returns the binary image with appropriate Content-Type
        - Includes cache headers (1 hour)
        - Returns 404 if no logo is configured or notary is inactive
      operationId: getNotaryLogo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logo image
          headers:
            Content-Type:
              schema:
                type: string
                enum: [image/jpeg, image/png]
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Logo not found or notary inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Logo not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T12:00:00-06:00"
        version:
          type: string
          example: "3.0.0"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: User's login username
          example: "johndoe"
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
          example: "secretpassword"

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token from a previous login or refresh
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
          description: JWT access token for API authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 7200
        tokenType:
          type: string
          enum: [Bearer]
          description: Token type (always "Bearer")
          example: "Bearer"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific validation errors (optional)
          example:
            username: ["Username is required"]

    # JWT Token Payload Schemas (for documentation)
    AccessTokenPayload:
      type: object
      description: Decoded access token payload
      properties:
        iss:
          type: string
          description: Token issuer
          example: "security@devrob"
        aud:
          type: string
          description: Token audience
          example: "apps@devrob"
        iat:
          type: integer
          description: Issued at (Unix timestamp)
          example: 1699531200
        exp:
          type: integer
          description: Expiration time (Unix timestamp)
          example: 1699538400
        userId:
          type: integer
          description: Authenticated user ID
          example: 1
        notaryId:
          type: integer
          description: User's notary ID (tenant)
          example: 1
        features:
          type: array
          items:
            type: string
          description: User's feature permissions
          example: ["DEEDS", "ACTS", "USERS"]

    RefreshTokenPayload:
      type: object
      description: Decoded refresh token payload
      properties:
        iss:
          type: string
          example: "security@devrob"
        aud:
          type: string
          example: "apps@devrob"
        iat:
          type: integer
          example: 1699531200
        exp:
          type: integer
          example: 1699617600
        userId:
          type: integer
          example: 1
        notaryId:
          type: integer
          example: 1
        type:
          type: string
          enum: [refresh]
          description: Token type identifier
          example: "refresh"

    # Acts schemas
    ActResponse:
      type: object
      required:
        - id
        - actName
        - actDescription
        - status
        - modificationDate
      properties:
        id:
          type: integer
          description: Act unique identifier
          example: 1
        actName:
          type: string
          description: Act name
          example: "Compraventa"
        actDescription:
          type: string
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09 12:00:00"

    CreateActRequest:
      type: object
      required:
        - actName
        - actDescription
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Act status (defaults to 1 = active)
          example: 1

    UpdateActRequest:
      type: object
      required:
        - actName
        - actDescription
        - status
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1

    # Subdivisions schemas
    SubdivisionResponse:
      type: object
      required:
        - subdivisionId
        - notaryId
        - name
        - userId
        - modificationDate
        - status
      properties:
        subdivisionId:
          type: integer
          description: Subdivision unique identifier
          example: 1
        notaryId:
          type: integer
          description: Notary ID (tenant)
          example: 1
        name:
          type: string
          description: Subdivision name
          example: "Residencial Las Palmas"
        userId:
          type: integer
          description: User who last modified the record
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09T12:00:00"
        status:
          type: integer
          enum: [1, 2]
          description: Subdivision status (1 = active, 2 = inactive)
          example: 1

    CreateSubdivisionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Subdivision name (must be unique within the notary)
          example: "Residencial Las Palmas"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Subdivision status (defaults to 1 = active)
          example: 1

    UpdateSubdivisionRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Subdivision name (must be unique within the notary)
          example: "Residencial Las Palmas"
        status:
          type: integer
          enum: [1, 2]
          description: Subdivision status (1 = active, 2 = inactive)
          example: 1

    # Deed Types schemas
    DeedTypeResponse:
      type: object
      required:
        - deedTypeId
        - notaryId
        - name
        - description
        - maxInscriptions
        - enableSubdivisions
        - userId
        - modificationDate
        - status
      properties:
        deedTypeId:
          type: integer
          description: Deed type unique identifier
          example: 1
        notaryId:
          type: integer
          description: Notary ID (tenant)
          example: 1
        name:
          type: string
          description: Deed type name
          example: "Compraventa"
        description:
          type: string
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          description: Maximum number of inscriptions allowed
          example: 3
        enableSubdivisions:
          type: boolean
          description: Whether subdivisions are enabled for this deed type
          example: true
        userId:
          type: integer
          description: User who last modified the record
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09T12:00:00"
        status:
          type: integer
          enum: [1, 2]
          description: Deed type status (1 = active, 2 = inactive)
          example: 1

    CreateDeedTypeRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Deed type name (must be unique within the notary)
          example: "Compraventa"
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of inscriptions allowed (defaults to 1)
          example: 3
        enableSubdivisions:
          type: boolean
          default: false
          description: Whether subdivisions are enabled for this deed type (defaults to false)
          example: true
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Deed type status (defaults to 1 = active)
          example: 1

    UpdateDeedTypeRequest:
      type: object
      required:
        - name
        - description
        - maxInscriptions
        - enableSubdivisions
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Deed type name (must be unique within the notary)
          example: "Compraventa"
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          minimum: 1
          description: Maximum number of inscriptions allowed
          example: 3
        enableSubdivisions:
          type: boolean
          description: Whether subdivisions are enabled for this deed type
          example: true
        status:
          type: integer
          enum: [1, 2]
          description: Deed type status (1 = active, 2 = inactive)
          example: 1

    # Payment Taxes schemas
    PaymentTaxResponse:
      type: object
      required:
        - taxId
        - taxName
        - status
      properties:
        taxId:
          type: integer
          description: Payment tax unique identifier
          example: 1
        taxName:
          type: string
          description: Payment tax name
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          description: Payment tax status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentTaxRequest:
      type: object
      required:
        - taxName
      properties:
        taxName:
          type: string
          minLength: 1
          maxLength: 500
          description: Payment tax name (trimmed; unique within the notary, case- and accent-insensitive)
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Payment tax status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentTaxRequest:
      type: object
      minProperties: 1
      properties:
        taxName:
          type: string
          minLength: 1
          maxLength: 500
          description: New payment tax name (optional; unique within the notary)
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          description: New payment tax status (optional; 1 = active, 2 = inactive)
          example: 2

    # Payment Procedures schemas
    PaymentProcedureResponse:
      type: object
      required:
        - procedureId
        - procedureName
        - status
      properties:
        procedureId:
          type: integer
          description: Payment procedure unique identifier
          example: 1
        procedureName:
          type: string
          description: Payment procedure name
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          description: Payment procedure status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentProcedureRequest:
      type: object
      required:
        - procedureName
      properties:
        procedureName:
          type: string
          minLength: 1
          maxLength: 500
          description: Payment procedure name (trimmed; unique within the notary, case- and accent-insensitive)
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Payment procedure status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentProcedureRequest:
      type: object
      minProperties: 1
      properties:
        procedureName:
          type: string
          minLength: 1
          maxLength: 500
          description: New payment procedure name (optional; unique within the notary)
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          description: New payment procedure status (optional; 1 = active, 2 = inactive)
          example: 2

    # Payment Clients schemas
    PaymentClientResponse:
      type: object
      required:
        - clientId
        - fullName
        - phone
        - email
        - status
      properties:
        clientId:
          type: integer
          description: Payment client unique identifier
          example: 12
        fullName:
          type: string
          description: Client full name
          example: "José López Hernández"
        phone:
          type: string
          description: Contact phone (empty string when not set)
          example: "55 1234 5678"
        email:
          type: string
          description: Contact email (empty string when not set)
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          description: Client status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentClientRequest:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 250
          description: Client full name (trimmed; not unique)
          example: "José López Hernández"
        phone:
          type: string
          nullable: true
          maxLength: 20
          default: ""
          description: Contact phone (trimmed, free format; `null` or `""` are stored as empty)
          example: "55 1234 5678"
        email:
          type: string
          nullable: true
          maxLength: 250
          default: ""
          description: Contact email (trimmed; must be a valid email when not empty; `null` or `""` are stored as empty)
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Client status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentClientRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 250
          description: New full name (optional; can't be null or blank)
          example: "José López Hernández"
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: New phone (optional). Omit to keep it; send `""` or `null` to clear it.
          example: "55 1234 5678"
        email:
          type: string
          nullable: true
          maxLength: 250
          description: New email (optional). Omit to keep it; send `""` or `null` to clear it.
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          description: New client status (optional; 1 = active, 2 = inactive)
          example: 2

    # Notary schemas
    NotaryResponse:
      type: object
      required:
        - id
        - name
        - notaryName
        - city
        - address
        - phone
        - rfc
        - hasLogo
        - status
      properties:
        id:
          type: integer
          description: Notary unique identifier
          example: 1
        name:
          type: string
          description: Notary office name
          example: "Notaría 45 de Guadalajara"
        notaryName:
          type: string
          description: Notary titular name
          example: "Lic. Juan Pérez López"
        city:
          type: string
          description: City where the notary is located
          example: "Guadalajara"
        address:
          type: string
          description: Full address of the notary office
          example: "Av. Vallarta 1234, Col. Centro"
        phone:
          type: string
          description: Contact phone number
          example: "33 1234-5678"
        rfc:
          type: string
          description: Tax identification number (RFC)
          example: "NPL850101ABC"
        hasLogo:
          type: boolean
          description: Whether the notary has a logo configured
          example: true
        status:
          type: integer
          enum: [1, 2]
          description: Notary status (1 = active, 2 = inactive)
          example: 1

    UpdateNotaryRequest:
      type: object
      required:
        - name
        - notaryName
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Notary office name (required)
          example: "Notaría 45 de Guadalajara"
        notaryName:
          type: string
          minLength: 1
          maxLength: 500
          description: Notary titular name (required)
          example: "Lic. Juan Pérez López"
        city:
          type: string
          maxLength: 150
          description: City where the notary is located (optional)
          example: "Guadalajara"
        address:
          type: string
          maxLength: 500
          description: Full address of the notary office (optional)
          example: "Av. Vallarta 1234, Col. Centro"
        phone:
          type: string
          maxLength: 20
          pattern: "^[\\d\\s\\-]*$"
          description: Contact phone number - only digits, spaces, and hyphens (optional)
          example: "33 1234-5678"
        rfc:
          type: string
          maxLength: 20
          description: Tax identification number (optional)
          example: "NPL850101ABC"
        logo:
          type: string
          format: binary
          description: Logo image file (JPG or PNG, max 512 KB)

    DeedListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        deedNumber:
          type: string
          description: Deed number (trimmed; may contain non-numeric text)
          example: "39734"
        book:
          type: string
          example: "750"
        deedDate:
          type: string
          format: date
          nullable: true
          example: "2026-10-30"
        actName:
          type: string
          nullable: true
          example: "Compraventa"
        deedTypeName:
          type: string
          nullable: true
          example: "Actuales"
        isFinished:
          type: boolean
          example: false

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 100
        total:
          type: integer
          example: 13372
        totalPages:
          type: integer
          description: 0 when there are no results
          example: 134
