  /payment-procedures/{id}/taxes:
    get:
      tags:
        - PaymentProcedureTaxes
      summary: List the taxes of a payment procedure
      description: |
        Returns the active taxes configured for the procedure, in natural alphabetical order by
        tax name (case- and accent-insensitive; ties are ordered by `taxId`).

        - Returns `[]` when the procedure has no taxes
        - Taxes that are inactive in the taxes catalog are not listed
        - An inactive procedure can still be read
      operationId: listPaymentProcedureTaxes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentProcedureId'
      responses:
        '200':
          description: Taxes of the procedure (plain array, no envelope)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureTaxResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Procedure not found (or it belongs to a different notary)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Procedure not found"

    post:
      tags:
        - PaymentProcedureTaxes
      summary: Add one or several taxes to a payment procedure
      description: |
        Send **either** `taxId` (single) **or** `taxes` (bulk), never both.

        - `defaultValue` is optional. Missing, `null`, negative and `-0` values are stored as `0`.
          It must be a JSON number (strings and booleans are rejected)
        - A tax previously removed from the procedure (soft deleted) is reactivated with the new `defaultValue`
        - Bulk accepts 1 to 50 items, is **all or nothing** (if any item is invalid nothing is written)
          and is allowed even if the procedure already has taxes

        **Error codes differ by body shape for item-level business errors:**

        | Error | Single | Bulk |
        |-------|--------|------|
        | Tax not found / other notary | 404 | 400 `errors["taxes.N.taxId"]` |
        | Tax is inactive | 422 | 400 `errors["taxes.N.taxId"]` |
        | Tax already assigned | 409 | 400 `errors["taxes.N.taxId"]` |

        In bulk every failing item is reported at once. Procedure-level errors (404 / 422) are the same for both shapes.
      operationId: addPaymentProcedureTaxes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentProcedureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProcedureTaxRequest'
            examples:
              single:
                summary: Single tax
                value:
                  taxId: 4
                  defaultValue: 500
              bulk:
                summary: Several taxes
                value:
                  taxes:
                    - taxId: 4
                      defaultValue: 500
                    - taxId: 7
      responses:
        '201':
          description: Tax(es) added (no body). Request the list again to read the result
        '400':
          description: Invalid ID format, validation error, or (bulk only) item-level business errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                body:
                  summary: Neither or both of taxId / taxes
                  value:
                    error: "Validation failed"
                    errors:
                      body: "Either taxId or taxes is required"
                bulkFormat:
                  summary: Invalid bulk items
                  value:
                    error: "Validation failed"
                    errors:
                      "taxes.1.taxId": "Duplicate tax ID in request"
                      "taxes.2.defaultValue": "Default value must be a number"
                bulkBusiness:
                  summary: Bulk item rejected by business rules
                  value:
                    error: "Validation failed"
                    errors:
                      "taxes.0.taxId": "Tax is already assigned to this procedure"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Procedure not found, or (single only) tax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                procedure:
                  value:
                    error: "Procedure not found"
                tax:
                  value:
                    error: "Tax not found"
        '409':
          description: (Single only) The tax is already assigned and active in this procedure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Tax is already assigned to this procedure"
        '422':
          description: The procedure is inactive, or (single only) the tax is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                procedure:
                  value:
                    error: "Procedure is inactive"
                tax:
                  value:
                    error: "Tax is inactive"

  /payment-procedures/{id}/taxes/{taxId}:
    put:
