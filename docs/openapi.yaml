openapi: 3.1.0
info:
  title: Notarial API
  description: |
    REST API for the Notarial Index System - deed tracking and management for notary offices.

    ## Authentication
    This API uses JWT Bearer tokens for authentication. Obtain tokens via the `/auth/login` endpoint.
    Include the access token in the `Authorization` header: `Bearer <accessToken>`

    ## Multi-tenancy
    All data is scoped to the authenticated user's notary (tenant). The `notaryId` is embedded in the JWT token.
  version: 3.0.0
  contact:
    name: DevRob
    email: jroberto.trejo14@gmail.com

servers:
  - url: http://localhost:8080/api/v3
    description: Local development
  - url: https://api.notarial.com/api/v3
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Health
    description: Health check endpoints
  - name: Acts
    description: Legal acts management (catalog per notary)
  - name: Subdivisions
    description: Subdivisions/locations management (catalog per notary)
  - name: DeedTypes
    description: Deed types management (catalog per notary)
  - name: Notary
    description: Notary profile management (current user's notary)
  - name: Deeds
    description: Deeds listing and search (current user's notary)

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the API status and version
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        Authenticates a user and returns JWT tokens.

        - Validates user credentials against the database
        - Checks that both user and notary are active
        - Automatically migrates MD5 passwords to bcrypt on successful login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "johndoe"
              password: "secretpassword"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Username and password are required"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      description: |
        Exchanges a valid refresh token for new access and refresh tokens.

        - The refresh token must be valid and not expired
        - Access tokens cannot be used as refresh tokens
        - Returns updated user features in the new access token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Refresh token is required"
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"

  /acts:
    get:
      tags:
        - Acts
      summary: List all acts
      description: |
        Returns all legal acts for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listActs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of acts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"

    post:
      tags:
        - Acts
      summary: Create a new act
      description: |
        Creates a new legal act for the authenticated user's notary.

        - Act name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createAct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActRequest'
      responses:
        '201':
          description: Act created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      actName: "Act name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Act name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /acts/{id}:
    get:
      tags:
        - Acts
      summary: Get act by ID
      description: |
        Returns a single act by its ID.

        Returns 404 if the act doesn't exist or belongs to a different notary.
      operationId: getAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      responses:
        '200':
          description: Act details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

    put:
      tags:
        - Acts
      summary: Update an act
      description: |
        Updates an existing act.

        - Can be used to modify name, description, or status
        - Setting status to 2 effectively deactivates the act (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActRequest'
      responses:
        '204':
          description: Act updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

  /subdivisions:
    get:
      tags:
        - Subdivisions
      summary: List all subdivisions
      description: |
        Returns all subdivisions for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listSubdivisions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of subdivisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubdivisionResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Subdivisions
      summary: Create a new subdivision
      description: |
        Creates a new subdivision for the authenticated user's notary.

        - Subdivision name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createSubdivision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubdivisionRequest'
      responses:
        '201':
          description: Subdivision created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Subdivision name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Subdivision name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subdivisions/{id}:
    get:
      tags:
        - Subdivisions
      summary: Get subdivision by ID
      description: |
        Returns a single subdivision by its ID.

        Returns 404 if the subdivision doesn't exist or belongs to a different notary.
      operationId: getSubdivision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subdivision ID
          schema:
            type: integer
      responses:
        '200':
          description: Subdivision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdivisionResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subdivision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Subdivision not found"

    put:
      tags:
        - Subdivisions
      summary: Update a subdivision
      description: |
        Updates an existing subdivision.

        - Can be used to modify name or status
        - Setting status to 2 effectively deactivates the subdivision (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateSubdivision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subdivision ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubdivisionRequest'
      responses:
        '204':
          description: Subdivision updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subdivision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Subdivision not found"

  /deed-types:
    get:
      tags:
        - DeedTypes
      summary: List all deed types
      description: |
        Returns all deed types for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listDeedTypes
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of deed types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeedTypeResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - DeedTypes
      summary: Create a new deed type
      description: |
        Creates a new deed type for the authenticated user's notary.

        - Deed type name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createDeedType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeedTypeRequest'
      responses:
        '201':
          description: Deed type created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Deed type name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Deed type name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deed-types/{id}:
    get:
      tags:
        - DeedTypes
      summary: Get deed type by ID
      description: |
        Returns a single deed type by its ID.

        Returns 404 if the deed type doesn't exist or belongs to a different notary.
      operationId: getDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      responses:
        '200':
          description: Deed type details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeedTypeResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deed type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Deed type not found"

    put:
      tags:
        - DeedTypes
      summary: Update a deed type
      description: |
        Updates an existing deed type.

        - Can be used to modify name, description, maxInscriptions, enableSubdivisions, or status
        - Setting status to 2 effectively deactivates the deed type (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeedTypeRequest'
      responses:
        '204':
          description: Deed type updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deed type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Deed type not found"

  /deeds:
    get:
      tags:
        - Deeds
      summary: List deeds
      description: |
        Returns a paginated list of the deeds of the authenticated user's notary
        (100 per page), ordered by deed number descending. Numeric deed numbers come
        first; non-numeric ones are placed last.

        **Search:** `search` is split into words (max 10 words, 100 characters each).
        Matching is case- and accent-insensitive and every word must match as a substring.
        A deed matches when all words are found in its number + act name, or when all words
        are found in the number + act name + name of a single active participant
        (seller or buyer). Word order is irrelevant.

        A page beyond the last one returns `200` with an empty `data` array.
      operationId: listDeeds
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (positive integer). Defaults to 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: search
          in: query
          description: Free text searched in deed number, act name and participant names
          required: false
          schema:
            type: string
          example: "compraventa perez"
      responses:
        '200':
          description: Paginated list of deeds
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeedListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  page: "Page must be a positive integer"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notary:
    get:
      tags:
        - Notary
      summary: Get current notary profile
      description: |
        Returns the profile information of the authenticated user's notary.

        - The notary ID is obtained from the JWT token
        - Returns 404 if the notary is inactive
      operationId: getNotary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notary profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

    post:
      tags:
        - Notary
      summary: Update current notary profile
      description: |
        Updates the profile information of the authenticated user's notary.

        - Uses POST instead of PUT to support multipart/form-data for logo upload
        - The notary ID is obtained from the JWT token
        - Only provided fields are updated (except name and notaryName which are required)
        - Logo must be JPG or PNG, max 512 KB
        - Logo is validated for real image content (not just extension)
      operationId: updateNotary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateNotaryRequest'
      responses:
        '204':
          description: Notary updated successfully (no body)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Field validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Notary name is required"
                logo_size:
                  summary: Logo too large
                  value:
                    error: "Logo file exceeds maximum size of 512 KB"
                logo_format:
                  summary: Invalid logo format
                  value:
                    error: "Logo must be JPG or PNG format"
                logo_invalid:
                  summary: Invalid image file
                  value:
                    error: "Invalid image file"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

  /notary/logo:
    get:
      tags:
        - Notary
      summary: Get notary logo
      description: |
        Returns the logo image of the authenticated user's notary.

        - Returns the binary image with appropriate Content-Type
        - Includes cache headers (1 hour)
        - Returns 404 if no logo is configured or notary is inactive
      operationId: getNotaryLogo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logo image
          headers:
            Content-Type:
              schema:
                type: string
                enum: [image/jpeg, image/png]
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Logo not found or notary inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Logo not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T12:00:00-06:00"
        version:
          type: string
          example: "3.0.0"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: User's login username
          example: "johndoe"
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
          example: "secretpassword"

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token from a previous login or refresh
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
          description: JWT access token for API authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 7200
        tokenType:
          type: string
          enum: [Bearer]
          description: Token type (always "Bearer")
          example: "Bearer"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific validation errors (optional)
          example:
            username: ["Username is required"]

    # JWT Token Payload Schemas (for documentation)
    AccessTokenPayload:
      type: object
      description: Decoded access token payload
      properties:
        iss:
          type: string
          description: Token issuer
          example: "security@devrob"
        aud:
          type: string
