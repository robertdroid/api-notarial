        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deed type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Deed type not found"

    put:
      tags:
        - DeedTypes
      summary: Update a deed type
      description: |
        Updates an existing deed type.

        - Can be used to modify name, description, maxInscriptions, enableSubdivisions, or status
        - Setting status to 2 effectively deactivates the deed type (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeedTypeRequest'
