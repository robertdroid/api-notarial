        - Deed type name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createDeedType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeedTypeRequest'
      responses:
        '201':
          description: Deed type created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Deed type name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Deed type name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deed-types/{id}:
    get:
      tags:
        - DeedTypes
      summary: Get deed type by ID
      description: |
        Returns a single deed type by its ID.

        Returns 404 if the deed type doesn't exist or belongs to a different notary.
      operationId: getDeedType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deed type ID
          schema:
            type: integer
      responses:
