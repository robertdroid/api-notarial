            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Procedure not found, or the tax has no active assignment in the procedure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                procedure:
                  value:
                    error: "Procedure not found"
                notAssigned:
                  value:
                    error: "Tax is not assigned to this procedure"

  /payment-clients:
    get:
      tags:
        - PaymentClients
      summary: List payment clients
      description: |
        Returns all payment clients of the authenticated user's notary, in natural alphabetical
        order by full name (case- and accent-insensitive; ties are ordered by `clientId`).
        The list is not paginated.

        Supports optional filtering by status and name. The name filter is a partial match,
        case- and accent-insensitive (e.g. `lopez` matches "José López").
        The wildcards `%` and `_` are treated as literal characters. An empty `name` means no filter.
      operationId: listPaymentClients
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by full name (partial match, case- and accent-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of payment clients (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentClientResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - PaymentClients
      summary: Create a payment client
      description: |
        Creates a payment client for the authenticated user's notary.

        - Full name is required; `phone` and `email` are optional and default to an empty string
        - Names are **not** unique: two clients may share the same name
        - All strings are trimmed before validation and storage
        - `phone` and `email` accept `null` or `""`, both stored as an empty string
        - Emoji and other 4-byte characters are not supported
        - `notaryId` in the body is ignored; the notary of the token is always used
        - The response has no body, so the new `clientId` can't be read from it
      operationId: createPaymentClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentClientRequest'
      responses:
        '201':
          description: Payment client created successfully (no body)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  fullName: "Full name is required"
                  email: "Email format is invalid"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-clients/{id}:
    get:
      tags:
        - PaymentClients
      summary: Get payment client by ID
      description: |
        Returns a single payment client by its ID.

        Returns 404 if the client doesn't exist, belongs to a different notary, or the ID is not positive.
      operationId: getPaymentClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment client ID
          schema:
            type: integer
      responses:
        '200':
          description: Payment client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentClientResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Client not found"

    put:
      tags:
        - PaymentClients
      summary: Update a payment client
      description: |
        Partially updates a payment client. At least one of `fullName`, `phone`, `email` or `status`
        is required.

        Field semantics:
        - **Omitted** field: the current value is kept
        - `phone` / `email` sent as `""`, whitespace only, or `null`: the value is **cleared** (stored as an empty string)
        - `fullName` sent as `null` or blank: rejected with 400 (the name can't be cleared)
        - Setting status to 2 deactivates the client (soft delete); there is no DELETE endpoint (405)
        - Names are not unique, so no duplicate check is performed

        The body is validated before the client is looked up: an invalid body for a non-existent ID returns 400.
      operationId: updatePaymentClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment client ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentClientRequest'
      responses:
        '204':
          description: Payment client updated successfully (no body)
        '400':
          description: Invalid ID format or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  body: "At least one field (fullName, phone, email, status) is required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Client not found"

  /payment-transactions:
    get:
      tags:
        - PaymentTransactions
      summary: Get transaction by UUID
      description: |
        Returns a single transaction by its UUID. The `uuid` query parameter is required.

        - UUID matching is case-sensitive and exact (no trimming)
        - Returns 404 if no transaction with that UUID exists for this notary
      operationId: getPaymentTransactionByUuid
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: query
          required: true
          description: Transaction UUID (case-sensitive)
          schema:
            type: string
            minLength: 1
            maxLength: 50
          example: "TXN-2026-001"
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '400':
          description: UUID parameter missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "UUID is required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Transaction not found"

    post:
      tags:
        - PaymentTransactions
      summary: Create a payment transaction
      description: |
        Creates a payment transaction for the authenticated user's notary.

        **Idempotency:** If a transaction with the same `uuid` already exists for this notary,
        the existing transaction is returned with status `200`. A new transaction returns `201`.
        This makes POST safe to retry.

        **Required fields:** `clientId`, `uuid`, `procedureId`, `date`

        **Taxes calculation:**
        - If the procedure has **no active taxes**, `taxes` is taken from the request and `details` are ignored.
        - If the procedure has **active taxes**, `taxes = Σ round(qty × amount, 2)` from matching details;
          the request `taxes` is ignored. Details referencing inactive taxes are silently skipped.

        **Total:** `total = round(fee + taxes, 2)` (always calculated, never from request).

        **Defaults:** `fee`, `taxes` default to 0; `reference`, `responsible`, `comments` default to empty;
        `details` defaults to an empty array.
      operationId: createPaymentTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentTransactionRequest'
      responses:
        '200':
          description: Transaction already exists (idempotent hit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                required:
                  summary: Missing required fields
                  value:
                    error: "Validation failed"
                    errors:
                      clientId: "Client ID is required"
                      uuid: "UUID is required"
                      procedureId: "Procedure ID is required"
                      date: "Date is required"
                format:
                  summary: Invalid field formats
                  value:
                    error: "Validation failed"
                    errors:
                      uuid: "UUID must be 1-50 alphanumeric characters, hyphens or underscores"
                      date: "Date must be a valid date in YYYY-MM-DD format"
                      fee: "Fee cannot be negative"
                details:
                  summary: Invalid details
                  value:
                    error: "Validation failed"
                    errors:
                      "details.0.taxId": "Tax ID must be a positive integer"
                      "details.1.amount": "Detail amount cannot be negative"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client or procedure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                client:
                  value:
                    error: "Client not found"
                procedure:
                  value:
                    error: "Procedure not found"
        '422':
          description: Client or procedure is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                client:
                  value:
                    error: "Client is inactive"
                procedure:
                  value:
                    error: "Procedure is inactive"

  /payment-transactions/{id}:
    get:
      tags:
        - PaymentTransactions
      summary: Get transaction by ID
      description: |
        Returns a single transaction by its ID.

        Returns 404 if the transaction doesn't exist or belongs to a different notary.
      operationId: getPaymentTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID
          schema:
            type: integer
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Transaction not found"

    put:
      tags:
        - PaymentTransactions
      summary: Update a payment transaction
      description: |
        Full replacement update of a transaction. All fields except `clientId` and `uuid`
        are required; omitted optional fields reset to their defaults.

        **Required fields:** `procedureId`, `date`

        **Optional fields (must match if sent):**
        - `clientId`: If provided, must match the stored value (cannot change the client)
        - `uuid`: If provided, must match the stored value (cannot change the UUID)

        **Taxes calculation:**
        - If the procedure has **no active taxes**, `taxes` is taken from the request and `details` are ignored.
        - If the procedure has **active taxes**, `taxes = Σ round(qty × amount, 2)` from matching details;
          the request `taxes` is ignored. Details referencing inactive taxes are silently skipped,
          but existing details with now-inactive taxes are preserved.

        **Procedure validation:** The procedure is only validated (must exist and be active) if it differs
        from the current one. This allows updating other fields even if the original procedure became inactive.

        **Details replacement:** The `details` array fully replaces all existing details.
        Details for taxes that are now inactive are silently skipped (not stored).
        Existing details for inactive taxes remain unless explicitly replaced.

        **Defaults when omitted:** `fee` → 0, `taxes` → 0, `reference` → "", `responsible` → "",
        `comments` → "", `details` → [].
      operationId: updatePaymentTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentTransactionRequest'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '400':
          description: Validation error or clientId/uuid mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                required:
                  summary: Missing required fields
                  value:
                    error: "Validation failed"
                    errors:
                      procedureId: "Procedure ID is required"
                      date: "Date is required"
                mismatch:
                  summary: Client or UUID mismatch
                  value:
                    error: "Validation failed"
                    errors:
                      clientId: "Client ID does not match the stored value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction or procedure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                transaction:
                  value:
                    error: "Transaction not found"
                procedure:
                  value:
                    error: "Procedure not found"
        '422':
          description: Procedure is inactive (only when changing procedure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Procedure is inactive"

  /deeds:
    get:
      tags:
        - Deeds
      summary: List deeds
      description: |
        Returns a paginated list of the deeds of the authenticated user's notary
        (100 per page), ordered by deed number descending. Numeric deed numbers come
        first; non-numeric ones are placed last.

        **Search:** `search` is split into words (max 10 words, 100 characters each).
        Matching is case- and accent-insensitive and every word must match as a substring.
        A deed matches when all words are found in its number + act name, or when all words
        are found in the number + act name + name of a single active participant
        (seller or buyer). Word order is irrelevant.

        A page beyond the last one returns `200` with an empty `data` array.
      operationId: listDeeds
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (positive integer). Defaults to 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: search
          in: query
          description: Free text searched in deed number, act name and participant names
          required: false
          schema:
            type: string
          example: "compraventa perez"
      responses:
        '200':
          description: Paginated list of deeds
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeedListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  page: "Page must be a positive integer"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: |
        Returns all users of the authenticated user's notary, ordered by paternal last name,
        maternal last name and first name (case- and accent-insensitive; ties are ordered by `id`).
        The list is not paginated.

        Optional `status` filter: `1` returns active users; `2` returns every non-active user,
        including legacy records stored with status `0`, which are exposed as `status: 2`.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
      responses:
        '200':
          description: List of users (empty array when none match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Users
      summary: Create a user
      description: |
        Creates a user in the authenticated user's notary.

        - `username`, `password`, `firstName`, `paternalLastName` and `access` are required
        - `username` is **globally unique** (across all notaries) and the check is **case-insensitive**:
          `Maria.Lopez` conflicts with an existing `maria.lopez`. It is stored exactly as sent
          (no trimming, case preserved) and the login is an exact match
        - `password` is stored hashed (bcrypt) and is never returned. It is not trimmed
        - Names are trimmed. Emoji and other 4-byte characters are not supported
        - `access` accepts `ESC` (deeds) and `PAG` (payments). Duplicates are removed and the
          codes are stored and returned in canonical order (`ESC`, `PAG`)
        - `status` defaults to `1` (active)
        - `notaryId` in the body is ignored; the notary of the token is always used
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                errors:
                  username: "Username must be 3 to 20 characters (letters, digits, . or _)"
                  password: "Password must be at least 8 characters"
                  access: "At least one access code is required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists (in any notary, case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Username already exists"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: |
        Returns a single user by its ID.

        Returns 404 if the user doesn't exist, belongs to a different notary, or the ID is not positive.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"

    put:
      tags:
        - Users
      summary: Update a user
      description: |
        Partially updates a user. At least one of `username`, `firstName`, `paternalLastName`,
        `maternalLastName`, `access` or `status` is required. Returns the updated user.

        Field semantics:
        - **Omitted** field: the current value is kept
        - `maternalLastName` sent as `""`, whitespace only, or `null`: the value is **cleared**
        - `firstName` / `paternalLastName` can't be cleared (400)
        - `password` is **rejected** with 400: it can't be changed through this endpoint
        - Setting `status` to 2 deactivates the user (soft delete); there is no DELETE endpoint (405).
          A user can't deactivate **themselves** (403), but can set their own status to 1
        - When `status` is omitted the stored value is left untouched, even for legacy records stored with `0`
        - `username` format is validated **only when the value changes** (comparison is exact, case
          included), so users with legacy usernames can still be edited. A new username must also be
          globally unique (case-insensitive); a user may change the casing of their own username

        Validation order: ID format → body (400) → user exists (404) → self-deactivation (403) →
        username format when changed (400) → username availability (409).
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid ID format, validation error, or invalid new username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyBody:
                  value:
                    error: "Validation failed"
                    errors:
                      body: "At least one field (username, firstName, paternalLastName, maternalLastName, access, status) is required"
                passwordNotAllowed:
                  value:
                    error: "Validation failed"
                    errors:
                      password: "Password cannot be changed through this endpoint"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated user tried to deactivate their own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Cannot deactivate your own account"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
        '409':
          description: Username already exists (in any notary, case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Username already exists"

  /notary:
    get:
      tags:
        - Notary
      summary: Get current notary profile
      description: |
        Returns the profile information of the authenticated user's notary.

        - The notary ID is obtained from the JWT token
        - Returns 404 if the notary is inactive
      operationId: getNotary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notary profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

    post:
      tags:
        - Notary
      summary: Update current notary profile
      description: |
        Updates the profile information of the authenticated user's notary.

        - Uses POST instead of PUT to support multipart/form-data for logo upload
        - The notary ID is obtained from the JWT token
        - Only provided fields are updated (except name and notaryName which are required)
        - Logo must be JPG or PNG, max 512 KB
        - Logo is validated for real image content (not just extension)
      operationId: updateNotary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateNotaryRequest'
      responses:
        '204':
          description: Notary updated successfully (no body)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Field validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Notary name is required"
                logo_size:
                  summary: Logo too large
                  value:
                    error: "Logo file exceeds maximum size of 512 KB"
                logo_format:
                  summary: Invalid logo format
                  value:
                    error: "Logo must be JPG or PNG format"
                logo_invalid:
                  summary: Invalid image file
                  value:
                    error: "Invalid image file"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notary not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Notary not found"

  /notary/logo:
    get:
      tags:
        - Notary
      summary: Get notary logo
      description: |
        Returns the logo image of the authenticated user's notary.

        - Returns the binary image with appropriate Content-Type
        - Includes cache headers (1 hour)
        - Returns 404 if no logo is configured or notary is inactive
      operationId: getNotaryLogo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logo image
          headers:
            Content-Type:
              schema:
                type: string
                enum: [image/jpeg, image/png]
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Logo not found or notary inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Logo not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  parameters:
    PaymentProcedureId:
      name: id
      in: path
      required: true
      description: Payment procedure ID
      schema:
        type: integer
    PaymentProcedureTaxId:
      name: taxId
      in: path
      required: true
      description: Payment tax ID
      schema:
        type: integer

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T12:00:00-06:00"
        version:
          type: string
          example: "3.0.0"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: User's login username
          example: "johndoe"
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
          example: "secretpassword"

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token from a previous login or refresh
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
          description: JWT access token for API authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 7200
        tokenType:
          type: string
          enum: [Bearer]
          description: Token type (always "Bearer")
          example: "Bearer"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific validation errors (optional)
          example:
            username: ["Username is required"]

    # JWT Token Payload Schemas (for documentation)
    AccessTokenPayload:
      type: object
      description: Decoded access token payload
      properties:
        iss:
          type: string
          description: Token issuer
          example: "security@devrob"
        aud:
          type: string
          description: Token audience
          example: "apps@devrob"
        iat:
          type: integer
          description: Issued at (Unix timestamp)
          example: 1699531200
        exp:
          type: integer
          description: Expiration time (Unix timestamp)
          example: 1699538400
        userId:
          type: integer
          description: Authenticated user ID
          example: 1
        notaryId:
          type: integer
          description: User's notary ID (tenant)
          example: 1
        features:
          type: array
          items:
            type: string
          description: User's feature permissions
          example: ["DEEDS", "ACTS", "USERS"]

    RefreshTokenPayload:
      type: object
      description: Decoded refresh token payload
      properties:
        iss:
          type: string
          example: "security@devrob"
        aud:
          type: string
          example: "apps@devrob"
        iat:
          type: integer
          example: 1699531200
        exp:
          type: integer
          example: 1699617600
        userId:
          type: integer
          example: 1
        notaryId:
          type: integer
          example: 1
        type:
          type: string
          enum: [refresh]
          description: Token type identifier
          example: "refresh"

    # Acts schemas
    ActResponse:
      type: object
      required:
        - id
        - actName
        - actDescription
        - status
        - modificationDate
      properties:
        id:
          type: integer
          description: Act unique identifier
          example: 1
        actName:
          type: string
          description: Act name
          example: "Compraventa"
        actDescription:
          type: string
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09 12:00:00"

    CreateActRequest:
      type: object
      required:
        - actName
        - actDescription
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Act status (defaults to 1 = active)
          example: 1

    UpdateActRequest:
      type: object
      required:
        - actName
        - actDescription
        - status
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1

    # Subdivisions schemas
    SubdivisionResponse:
      type: object
      required:
        - subdivisionId
        - notaryId
        - name
        - userId
        - modificationDate
        - status
      properties:
        subdivisionId:
          type: integer
          description: Subdivision unique identifier
          example: 1
        notaryId:
          type: integer
          description: Notary ID (tenant)
          example: 1
        name:
          type: string
          description: Subdivision name
          example: "Residencial Las Palmas"
        userId:
          type: integer
          description: User who last modified the record
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09T12:00:00"
        status:
          type: integer
          enum: [1, 2]
          description: Subdivision status (1 = active, 2 = inactive)
          example: 1

    CreateSubdivisionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Subdivision name (must be unique within the notary)
          example: "Residencial Las Palmas"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Subdivision status (defaults to 1 = active)
          example: 1

    UpdateSubdivisionRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Subdivision name (must be unique within the notary)
          example: "Residencial Las Palmas"
        status:
          type: integer
          enum: [1, 2]
          description: Subdivision status (1 = active, 2 = inactive)
          example: 1

    # Deed Types schemas
    DeedTypeResponse:
      type: object
      required:
        - deedTypeId
        - notaryId
        - name
        - description
        - maxInscriptions
        - enableSubdivisions
        - userId
        - modificationDate
        - status
      properties:
        deedTypeId:
          type: integer
          description: Deed type unique identifier
          example: 1
        notaryId:
          type: integer
          description: Notary ID (tenant)
          example: 1
        name:
          type: string
          description: Deed type name
          example: "Compraventa"
        description:
          type: string
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          description: Maximum number of inscriptions allowed
          example: 3
        enableSubdivisions:
          type: boolean
          description: Whether subdivisions are enabled for this deed type
          example: true
        userId:
          type: integer
          description: User who last modified the record
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09T12:00:00"
        status:
          type: integer
          enum: [1, 2]
          description: Deed type status (1 = active, 2 = inactive)
          example: 1

    CreateDeedTypeRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Deed type name (must be unique within the notary)
          example: "Compraventa"
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of inscriptions allowed (defaults to 1)
          example: 3
        enableSubdivisions:
          type: boolean
          default: false
          description: Whether subdivisions are enabled for this deed type (defaults to false)
          example: true
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Deed type status (defaults to 1 = active)
          example: 1

    UpdateDeedTypeRequest:
      type: object
      required:
        - name
        - description
        - maxInscriptions
        - enableSubdivisions
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Deed type name (must be unique within the notary)
          example: "Compraventa"
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Deed type description
          example: "Escritura de compraventa de inmuebles"
        maxInscriptions:
          type: integer
          minimum: 1
          description: Maximum number of inscriptions allowed
          example: 3
        enableSubdivisions:
          type: boolean
          description: Whether subdivisions are enabled for this deed type
          example: true
        status:
          type: integer
          enum: [1, 2]
          description: Deed type status (1 = active, 2 = inactive)
          example: 1

    # Payment Taxes schemas
    PaymentTaxResponse:
      type: object
      required:
        - taxId
        - taxName
        - status
      properties:
        taxId:
          type: integer
          description: Payment tax unique identifier
          example: 1
        taxName:
          type: string
          description: Payment tax name
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          description: Payment tax status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentTaxRequest:
      type: object
      required:
        - taxName
      properties:
        taxName:
          type: string
          minLength: 1
          maxLength: 500
          description: Payment tax name (trimmed; unique within the notary, case- and accent-insensitive)
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Payment tax status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentTaxRequest:
      type: object
      minProperties: 1
      properties:
        taxName:
          type: string
          minLength: 1
          maxLength: 500
          description: New payment tax name (optional; unique within the notary)
          example: "ISR"
        status:
          type: integer
          enum: [1, 2]
          description: New payment tax status (optional; 1 = active, 2 = inactive)
          example: 2

    # Payment Procedures schemas
    PaymentProcedureResponse:
      type: object
      required:
        - procedureId
        - procedureName
        - status
      properties:
        procedureId:
          type: integer
          description: Payment procedure unique identifier
          example: 1
        procedureName:
          type: string
          description: Payment procedure name
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          description: Payment procedure status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentProcedureRequest:
      type: object
      required:
        - procedureName
      properties:
        procedureName:
          type: string
          minLength: 1
          maxLength: 500
          description: Payment procedure name (trimmed; unique within the notary, case- and accent-insensitive)
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Payment procedure status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentProcedureRequest:
      type: object
      minProperties: 1
      properties:
        procedureName:
          type: string
          minLength: 1
          maxLength: 500
          description: New payment procedure name (optional; unique within the notary)
          example: "Escritura de compraventa"
        status:
          type: integer
          enum: [1, 2]
          description: New payment procedure status (optional; 1 = active, 2 = inactive)
          example: 2

    # Payment Procedure Taxes schemas
    ProcedureTaxResponse:
      type: object
      required:
        - procedureId
        - taxId
        - taxName
        - defaultValue
      properties:
        procedureId:
          type: integer
          description: Payment procedure ID
          example: 1
        taxId:
          type: integer
          description: Payment tax ID
          example: 4
        taxName:
          type: string
          description: Payment tax name
          example: "ISR"
        defaultValue:
          type: number
          format: double
          description: Default value of the tax for this procedure
          example: 500

    AddProcedureTaxRequest:
      description: Provide either `taxId` (single) or `taxes` (bulk), never both
      oneOf:
        - $ref: '#/components/schemas/AddSingleProcedureTaxRequest'
        - $ref: '#/components/schemas/AddBulkProcedureTaxesRequest'

    AddSingleProcedureTaxRequest:
      type: object
      required:
        - taxId
      additionalProperties: false
      properties:
        taxId:
          type: integer
          minimum: 1
          description: Payment tax ID. Must be a JSON integer
          example: 4
        defaultValue:
          type: number
          nullable: true
          description: Default value (optional). Missing, null or negative values are stored as 0. Must be a JSON number
          example: 500

    AddBulkProcedureTaxesRequest:
      type: object
      required:
        - taxes
      additionalProperties: false
      properties:
        taxes:
          type: array
          minItems: 1
          maxItems: 50
          description: Taxes to add (all or nothing). `taxId` values must not repeat
          items:
            type: object
            required:
              - taxId
            properties:
              taxId:
                type: integer
                minimum: 1
                example: 4
              defaultValue:
                type: number
                nullable: true
                example: 500

    UpdateProcedureTaxRequest:
      type: object
      required:
        - defaultValue
      properties:
        defaultValue:
          type: number
          description: New default value (required, not null). Negative values are stored as 0
          example: 750.5

    # Payment Clients schemas
    PaymentClientResponse:
      type: object
      required:
        - clientId
        - fullName
        - phone
        - email
        - status
      properties:
        clientId:
          type: integer
          description: Payment client unique identifier
          example: 12
        fullName:
          type: string
          description: Client full name
          example: "José López Hernández"
        phone:
          type: string
          description: Contact phone (empty string when not set)
          example: "55 1234 5678"
        email:
          type: string
          description: Contact email (empty string when not set)
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          description: Client status (1 = active, 2 = inactive)
          example: 1

    CreatePaymentClientRequest:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 250
          description: Client full name (trimmed; not unique)
          example: "José López Hernández"
        phone:
          type: string
          nullable: true
          maxLength: 20
          default: ""
          description: Contact phone (trimmed, free format; `null` or `""` are stored as empty)
          example: "55 1234 5678"
        email:
          type: string
          nullable: true
          maxLength: 250
          default: ""
          description: Contact email (trimmed; must be a valid email when not empty; `null` or `""` are stored as empty)
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Client status (defaults to 1 = active). Must be a JSON integer.
          example: 1

    UpdatePaymentClientRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 250
          description: New full name (optional; can't be null or blank)
          example: "José López Hernández"
        phone:
          type: string
          nullable: true
          maxLength: 20
          description: New phone (optional). Omit to keep it; send `""` or `null` to clear it.
          example: "55 1234 5678"
        email:
          type: string
          nullable: true
          maxLength: 250
          description: New email (optional). Omit to keep it; send `""` or `null` to clear it.
          example: "jose@example.com"
        status:
          type: integer
          enum: [1, 2]
          description: New client status (optional; 1 = active, 2 = inactive)
          example: 2

    # User schemas
    UserResponse:
      type: object
      required:
        - id
        - username
        - firstName
        - paternalLastName
        - maternalLastName
        - access
        - status
        - lastAccess
      properties:
        id:
          type: integer
          example: 13
        username:
          type: string
          example: "maria.lopez"
        firstName:
          type: string
          example: "María"
        paternalLastName:
          type: string
          example: "López"
        maternalLastName:
          type: string
          description: Empty string when not set
          example: "García"
        access:
          type: array
          description: Modules the user can use, in canonical order
          items:
            type: string
            enum: [ESC, PAG]
          example: ["ESC", "PAG"]
        status:
          type: integer
          enum: [1, 2]
          description: 1 = active, 2 = inactive (legacy `0` values are exposed as 2)
          example: 1
        lastAccess:
          type: string
          format: date-time
          nullable: true
          description: Last login, set by the auth module. `null` if the user never logged in
          example: "2026-11-10T08:30:00"

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - firstName
        - paternalLastName
        - access
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._]{3,20}$'
          description: Globally unique, case-insensitive. Stored as sent
          example: "maria.lopez"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: At least 8 characters and at most 72 bytes. Not trimmed
          example: "SecurePass123"
        firstName:
          type: string
          maxLength: 150
          example: "María"
        paternalLastName:
          type: string
          maxLength: 150
          example: "López"
        maternalLastName:
          type: string
          nullable: true
          maxLength: 150
          description: Optional. `null` or `""` are stored as an empty string
          example: "García"
        access:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ESC, PAG]
          example: ["ESC", "PAG"]
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Must be an integer (`"1"` is rejected)

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: |
        At least one of the fields below is required. `password` is rejected (400).
      properties:
        username:
          type: string
          description: |
            Format `^[A-Za-z0-9._]{3,20}$`, validated only when it differs from the current value.
            Globally unique, case-insensitive
          example: "maria.lopez"
        firstName:
          type: string
          maxLength: 150
        paternalLastName:
          type: string
          maxLength: 150
        maternalLastName:
          type: string
          nullable: true
          maxLength: 150
          description: "`null` or `\"\"` clears the value"
        access:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ESC, PAG]
        status:
          type: integer
          enum: [1, 2]
          description: Must be an integer. A user can't set their own status to 2 (403)

    # Notary schemas
    NotaryResponse:
      type: object
      required:
        - id
        - name
        - notaryName
        - city
        - address
        - phone
        - rfc
        - hasLogo
        - status
      properties:
        id:
          type: integer
          description: Notary unique identifier
          example: 1
        name:
          type: string
          description: Notary office name
          example: "Notaría 45 de Guadalajara"
        notaryName:
          type: string
          description: Notary titular name
          example: "Lic. Juan Pérez López"
        city:
          type: string
          description: City where the notary is located
          example: "Guadalajara"
        address:
          type: string
          description: Full address of the notary office
          example: "Av. Vallarta 1234, Col. Centro"
        phone:
          type: string
          description: Contact phone number
          example: "33 1234-5678"
        rfc:
          type: string
          description: Tax identification number (RFC)
          example: "NPL850101ABC"
        hasLogo:
          type: boolean
          description: Whether the notary has a logo configured
          example: true
        status:
          type: integer
          enum: [1, 2]
          description: Notary status (1 = active, 2 = inactive)
          example: 1

    UpdateNotaryRequest:
      type: object
      required:
        - name
        - notaryName
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: Notary office name (required)
          example: "Notaría 45 de Guadalajara"
        notaryName:
          type: string
          minLength: 1
          maxLength: 500
          description: Notary titular name (required)
          example: "Lic. Juan Pérez López"
        city:
          type: string
          maxLength: 150
          description: City where the notary is located (optional)
          example: "Guadalajara"
        address:
          type: string
          maxLength: 500
          description: Full address of the notary office (optional)
          example: "Av. Vallarta 1234, Col. Centro"
        phone:
          type: string
          maxLength: 20
          pattern: "^[\\d\\s\\-]*$"
          description: Contact phone number - only digits, spaces, and hyphens (optional)
          example: "33 1234-5678"
        rfc:
          type: string
          maxLength: 20
          description: Tax identification number (optional)
          example: "NPL850101ABC"
        logo:
          type: string
          format: binary
          description: Logo image file (JPG or PNG, max 512 KB)

    DeedListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        deedNumber:
          type: string
          description: Deed number (trimmed; may contain non-numeric text)
          example: "39734"
        book:
          type: string
          example: "750"
        deedDate:
          type: string
          format: date
          nullable: true
          example: "2026-10-30"
        actName:
          type: string
          nullable: true
          example: "Compraventa"
        deedTypeName:
          type: string
          nullable: true
          example: "Actuales"
        isFinished:
          type: boolean
          example: false

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 100
        total:
          type: integer
          example: 13372
        totalPages:
          type: integer
          description: 0 when there are no results
          example: 134

    # Payment Transactions schemas
    PaymentTransactionResponse:
      type: object
      required:
        - transactionId
        - uuid
        - clientId
        - clientName
        - procedureId
        - procedureName
        - date
        - fee
        - taxes
        - total
        - reference
        - responsible
        - comments
        - details
      properties:
        transactionId:
          type: integer
          description: Transaction unique identifier
          example: 42
        uuid:
          type: string
          description: External unique identifier (case-sensitive)
          example: "TXN-2026-001"
        clientId:
          type: integer
          description: Payment client ID
          example: 12
        clientName:
          type: string
          description: Client full name at the time of the transaction
          example: "José López Hernández"
        procedureId:
          type: integer
          description: Payment procedure ID
          example: 3
        procedureName:
          type: string
          description: Procedure name at the time of the transaction
          example: "Escritura de compraventa"
        date:
          type: string
          format: date
          description: Transaction date (YYYY-MM-DD)
          example: "2026-11-11"
        fee:
          type: number
          format: double
          description: Base fee amount
          example: 5000.00
        taxes:
          type: number
          format: double
          description: Total taxes (manual or calculated from details)
          example: 1500.00
        total:
          type: number
          format: double
          description: Total amount (fee + taxes)
          example: 6500.00
        reference:
          type: string
          description: External reference or invoice number
          example: "INV-2026-0042"
        responsible:
          type: string
          description: Name of the responsible person
          example: "María García"
        comments:
          type: string
          description: Additional comments
          example: "Pago parcial, resto pendiente"
        details:
          type: array
          description: Transaction detail lines (taxes breakdown)
          items:
            $ref: '#/components/schemas/PaymentTransactionDetailResponse'

    PaymentTransactionDetailResponse:
      type: object
      required:
        - taxId
        - taxName
        - quantity
        - amount
        - date
        - comments
      properties:
        taxId:
          type: integer
          description: Payment tax ID
          example: 4
        taxName:
          type: string
          description: Tax name
          example: "ISR"
        quantity:
          type: integer
          description: Quantity (multiplier for amount)
          example: 2
        amount:
          type: number
          format: double
          description: Unit amount
          example: 750.00
        date:
          type: string
          format: date
          nullable: true
          description: Detail-specific date (null when not set)
          example: "2026-11-15"
        comments:
          type: string
          description: Detail comments (empty when not set)
          example: "Primer pago"

    CreatePaymentTransactionRequest:
      type: object
      required:
        - clientId
        - uuid
        - procedureId
        - date
      properties:
        clientId:
          type: integer
          minimum: 1
          description: Payment client ID (must be active)
          example: 12
        uuid:
          type: string
          minLength: 1
          maxLength: 50
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            External unique identifier. Must be 1-50 characters: alphanumeric, hyphens, underscores.
            Case-sensitive and not trimmed. Used for idempotency.
          example: "TXN-2026-001"
        procedureId:
          type: integer
          minimum: 1
          description: Payment procedure ID (must be active)
          example: 3
        date:
          type: string
          format: date
          description: Transaction date (YYYY-MM-DD)
          example: "2026-11-11"
        fee:
          type: number
          minimum: 0
          default: 0
          description: Base fee amount (non-negative, rounded to 2 decimals)
          example: 5000.00
        taxes:
          type: number
          minimum: 0
          default: 0
          description: |
            Total taxes. Used only in **manual mode** (procedure has no active taxes).
            In calculated mode, this value is ignored and computed from details.
          example: 1500.00
        reference:
          type: string
          maxLength: 500
          default: ""
          description: External reference or invoice number (trimmed)
          example: "INV-2026-0042"
        responsible:
          type: string
          maxLength: 500
          default: ""
          description: Name of the responsible person (trimmed)
          example: "María García"
        comments:
          type: string
          maxLength: 1000
          default: ""
          description: Additional comments (trimmed)
          example: "Pago parcial"
        details:
          type: array
          maxItems: 50
          default: []
          description: |
            Transaction detail lines. In **calculated mode**, only details matching
            active procedure taxes contribute to the `taxes` total.
            In **manual mode**, details are silently ignored.
          items:
            $ref: '#/components/schemas/PaymentTransactionDetailInput'

    UpdatePaymentTransactionRequest:
      type: object
      required:
        - procedureId
        - date
      properties:
        clientId:
          type: integer
          minimum: 1
          description: |
            Optional. If provided, must match the stored client ID (cannot be changed).
            Omit to leave unchanged.
          example: 12
        uuid:
          type: string
          minLength: 1
          maxLength: 50
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            Optional. If provided, must match the stored UUID (cannot be changed).
            Omit to leave unchanged.
          example: "TXN-2026-001"
        procedureId:
          type: integer
          minimum: 1
          description: |
            Payment procedure ID. If different from the current one, the new procedure
            must exist and be active. If unchanged, no validation is performed (allows
            updating other fields even if the procedure became inactive).
          example: 3
        date:
          type: string
          format: date
          description: Transaction date (YYYY-MM-DD)
          example: "2026-11-11"
        fee:
          type: number
          minimum: 0
          default: 0
          description: Base fee amount (defaults to 0 if omitted)
          example: 5000.00
        taxes:
          type: number
          minimum: 0
          default: 0
          description: |
            Total taxes. Used only in **manual mode**. Defaults to 0 if omitted.
          example: 1500.00
        reference:
          type: string
          maxLength: 500
          default: ""
          description: External reference (defaults to empty if omitted)
          example: "INV-2026-0042"
        responsible:
          type: string
          maxLength: 500
          default: ""
          description: Responsible person (defaults to empty if omitted)
          example: "María García"
        comments:
          type: string
          maxLength: 1000
          default: ""
          description: Comments (defaults to empty if omitted)
          example: "Pago parcial"
        details:
          type: array
          maxItems: 50
          default: []
          description: |
            Full replacement of detail lines. Existing details for inactive taxes
            are preserved unless this array explicitly replaces them.
            Details for inactive taxes in this array are silently skipped.
          items:
            $ref: '#/components/schemas/PaymentTransactionDetailInput'

    PaymentTransactionDetailInput:
      type: object
      required:
        - taxId
      properties:
        taxId:
          type: integer
          minimum: 1
          description: Payment tax ID
          example: 4
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Quantity (multiplier for amount)
          example: 2
        amount:
          type: number
          minimum: 0
          default: 0
          description: Unit amount (non-negative, rounded to 2 decimals)
          example: 750.00
        date:
          type: string
          format: date
          nullable: true
          default: null
          description: Detail-specific date (YYYY-MM-DD, optional)
          example: "2026-11-15"
        comments:
          type: string
          maxLength: 500
          default: ""
          description: Detail comments (trimmed)
          example: "Primer pago"
