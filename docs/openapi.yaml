openapi: 3.1.0
info:
  title: Notarial API
  description: |
    REST API for the Notarial Index System - deed tracking and management for notary offices.

    ## Authentication
    This API uses JWT Bearer tokens for authentication. Obtain tokens via the `/auth/login` endpoint.
    Include the access token in the `Authorization` header: `Bearer <accessToken>`

    ## Multi-tenancy
    All data is scoped to the authenticated user's notary (tenant). The `notaryId` is embedded in the JWT token.
  version: 3.0.0
  contact:
    name: DevRob
    email: jroberto.trejo14@gmail.com

servers:
  - url: http://localhost:8080/api/v3
    description: Local development
  - url: https://api.notarial.com/api/v3
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Health
    description: Health check endpoints
  - name: Acts
    description: Legal acts management (catalog per notary)
  - name: Subdivisions
    description: Subdivisions/locations management (catalog per notary)
  - name: DeedTypes
    description: Deed types management (catalog per notary)
  - name: PaymentTaxes
    description: Payment taxes/concepts catalog management (catalog per notary)
  - name: PaymentProcedures
    description: Payment procedures catalog management (catalog per notary)
  - name: PaymentProcedureTaxes
    description: Taxes configured for each payment procedure, with their default values (sub-resource of a procedure)
  - name: PaymentClients
    description: Payment clients catalog management (catalog per notary)
  - name: PaymentTransactions
    description: |
      Payment transactions management (transactional records per notary).

      **Taxes calculation modes:**
      - **Manual mode:** When the procedure has no active taxes configured, the `taxes` value
        from the request is used directly and `details` are silently ignored.
      - **Calculated mode:** When the procedure has active taxes, `taxes = Σ round(qty × amount, 2)`
        from the details that match active taxes; the request `taxes` field is ignored.

      In both modes, `total = round(fee + taxes, 2)`.

      **POST idempotency:** The `uuid` field makes POST idempotent. If a transaction with the
      same `uuid` already exists for the notary, a `200` is returned with the existing record.
      A new transaction returns `201`.
  - name: Users
    description: |
      Management of the users of the authenticated user's notary.

      - Any authenticated user of the notary can manage its users (there is no admin role yet)
      - Passwords are never returned. They are set on creation (bcrypt) and cannot be changed through this API yet
      - `status` is normalized: legacy `0` values are exposed as `2` (inactive)
      - A deactivated user keeps a valid access token until it expires, but can no longer refresh it
  - name: Notary
    description: Notary profile management (current user's notary)
  - name: Deeds
    description: Deeds listing and search (current user's notary)

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the API status and version
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        Authenticates a user and returns JWT tokens.

        - Validates user credentials against the database
        - Checks that both user and notary are active
        - Automatically migrates MD5 passwords to bcrypt on successful login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "johndoe"
              password: "secretpassword"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Username and password are required"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      description: |
        Exchanges a valid refresh token for new access and refresh tokens.

        - The refresh token must be valid and not expired
        - Access tokens cannot be used as refresh tokens
        - Returns updated user features in the new access token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Refresh token is required"
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"

  /acts:
    get:
      tags:
        - Acts
      summary: List all acts
      description: |
        Returns all legal acts for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listActs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of acts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"

    post:
      tags:
        - Acts
      summary: Create a new act
      description: |
        Creates a new legal act for the authenticated user's notary.

        - Act name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createAct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActRequest'
      responses:
        '201':
          description: Act created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      actName: "Act name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Act name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /acts/{id}:
    get:
      tags:
        - Acts
      summary: Get act by ID
      description: |
        Returns a single act by its ID.

        Returns 404 if the act doesn't exist or belongs to a different notary.
      operationId: getAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      responses:
        '200':
          description: Act details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

    put:
      tags:
        - Acts
      summary: Update an act
      description: |
        Updates an existing act.

        - Can be used to modify name, description, or status
        - Setting status to 2 effectively deactivates the act (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActRequest'
      responses:
        '204':
          description: Act updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

