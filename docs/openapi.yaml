                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Subdivisions
      summary: Create a new subdivision
      description: |
        Creates a new subdivision for the authenticated user's notary.

        - Subdivision name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createSubdivision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubdivisionRequest'
      responses:
        '201':
          description: Subdivision created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      name: "Subdivision name is required"
