openapi: 3.1.0
info:
  title: Notarial API
  description: |
    REST API for the Notarial Index System - deed tracking and management for notary offices.

    ## Authentication
    This API uses JWT Bearer tokens for authentication. Obtain tokens via the `/auth/login` endpoint.
    Include the access token in the `Authorization` header: `Bearer <accessToken>`

    ## Multi-tenancy
    All data is scoped to the authenticated user's notary (tenant). The `notaryId` is embedded in the JWT token.
  version: 3.0.0
  contact:
    name: DevRob
    email: jroberto.trejo14@gmail.com

servers:
  - url: http://localhost:8080/api/v3
    description: Local development
  - url: https://api.notarial.com/api/v3
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Health
    description: Health check endpoints
  - name: Acts
    description: Legal acts management (catalog per notary)

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the API status and version
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        Authenticates a user and returns JWT tokens.

        - Validates user credentials against the database
        - Checks that both user and notary are active
        - Automatically migrates MD5 passwords to bcrypt on successful login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "johndoe"
              password: "secretpassword"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Username and password are required"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      description: |
        Exchanges a valid refresh token for new access and refresh tokens.

        - The refresh token must be valid and not expired
        - Access tokens cannot be used as refresh tokens
        - Returns updated user features in the new access token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Refresh token is required"
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"

  /acts:
    get:
      tags:
        - Acts
      summary: List all acts
      description: |
        Returns all legal acts for the authenticated user's notary.

        Supports optional filtering by status and name (partial match, case-insensitive).
      operationId: listActs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (1 = active, 2 = inactive)
          required: false
          schema:
            type: integer
            enum: [1, 2]
        - name: name
          in: query
          description: Filter by name (partial match, case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of acts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status value"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"

    post:
      tags:
        - Acts
      summary: Create a new act
      description: |
        Creates a new legal act for the authenticated user's notary.

        - Act name must be unique within the notary (case-insensitive)
        - Names are trimmed before validation and storage
      operationId: createAct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActRequest'
      responses:
        '201':
          description: Act created successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    errors:
                      actName: "Act name is required"
                duplicate:
                  summary: Duplicate name
                  value:
                    error: "Act name already exists"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /acts/{id}:
    get:
      tags:
        - Acts
      summary: Get act by ID
      description: |
        Returns a single act by its ID.

        Returns 404 if the act doesn't exist or belongs to a different notary.
      operationId: getAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      responses:
        '200':
          description: Act details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActResponse'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid ID format"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

    put:
      tags:
        - Acts
      summary: Update an act
      description: |
        Updates an existing act.

        - Can be used to modify name, description, or status
        - Setting status to 2 effectively deactivates the act (soft delete)
        - Name uniqueness is validated excluding the current record
      operationId: updateAct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Act ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActRequest'
      responses:
        '204':
          description: Act updated successfully (no body)
        '400':
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Act not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Act not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T12:00:00-06:00"
        version:
          type: string
          example: "3.0.0"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: User's login username
          example: "johndoe"
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
          example: "secretpassword"

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token from a previous login or refresh
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
          description: JWT access token for API authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token for obtaining new tokens
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 7200
        tokenType:
          type: string
          enum: [Bearer]
          description: Token type (always "Bearer")
          example: "Bearer"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific validation errors (optional)
          example:
            username: ["Username is required"]

    # JWT Token Payload Schemas (for documentation)
    AccessTokenPayload:
      type: object
      description: Decoded access token payload
      properties:
        iss:
          type: string
          description: Token issuer
          example: "security@devrob"
        aud:
          type: string
          description: Token audience
          example: "apps@devrob"
        iat:
          type: integer
          description: Issued at (Unix timestamp)
          example: 1699531200
        exp:
          type: integer
          description: Expiration time (Unix timestamp)
          example: 1699538400
        userId:
          type: integer
          description: Authenticated user ID
          example: 1
        notaryId:
          type: integer
          description: User's notary ID (tenant)
          example: 1
        features:
          type: array
          items:
            type: string
          description: User's feature permissions
          example: ["DEEDS", "ACTS", "USERS"]

    RefreshTokenPayload:
      type: object
      description: Decoded refresh token payload
      properties:
        iss:
          type: string
          example: "security@devrob"
        aud:
          type: string
          example: "apps@devrob"
        iat:
          type: integer
          example: 1699531200
        exp:
          type: integer
          example: 1699617600
        userId:
          type: integer
          example: 1
        notaryId:
          type: integer
          example: 1
        type:
          type: string
          enum: [refresh]
          description: Token type identifier
          example: "refresh"

    # Acts schemas
    ActResponse:
      type: object
      required:
        - id
        - actName
        - actDescription
        - status
        - modificationDate
      properties:
        id:
          type: integer
          description: Act unique identifier
          example: 1
        actName:
          type: string
          description: Act name
          example: "Compraventa"
        actDescription:
          type: string
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1
        modificationDate:
          type: string
          format: date-time
          description: Last modification date
          example: "2026-11-09 12:00:00"

    CreateActRequest:
      type: object
      required:
        - actName
        - actDescription
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          default: 1
          description: Act status (defaults to 1 = active)
          example: 1

    UpdateActRequest:
      type: object
      required:
        - actName
        - actDescription
        - status
      properties:
        actName:
          type: string
          minLength: 1
          maxLength: 200
          description: Act name (must be unique within the notary)
          example: "Compraventa"
        actDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Act description
          example: "Acto jurídico de compraventa de bienes inmuebles"
        status:
          type: integer
          enum: [1, 2]
          description: Act status (1 = active, 2 = inactive)
          example: 1
